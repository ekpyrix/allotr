version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # One entry covers every workspace through the root pnpm lockfile.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Let new releases age before they are proposed, to limit exposure to
    # compromised packages.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns: ["*"]

  # Dockerfile arrives with the image work later in M0.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns: ["*"]
