name: CI

# No branch filter on pull_request: stacked PRs target the branch below them,
# not dev, and must still be checked.
on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through Corepack
        run: |
          corepack enable pnpm
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # ESLint, Prettier, dependency direction and typecheck.
      - run: make lint

      - run: make test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through Corepack
        run: |
          corepack enable pnpm
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @allotr/web exec playwright install --with-deps chromium

      # Onboarding, sign-in with 2FA and Today at phone and desktop sizes,
      # with axe accessibility checks.
      - run: make e2e

      - name: Keep traces of failed runs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: allotr:ci
          cache-from: type=gha

      # docker compose up serves the onboarding page, and s6 restarts a
      # killed server process.
      - name: Smoke-test with compose
        working-directory: deploy
        env:
          ALLOTR_IMAGE: allotr:ci
        run: |
          set -euo pipefail
          printf 'ALLOTR_BASE_URL=http://127.0.0.1:8080\nALLOTR_SECRET_KEY=%s\n' \
            "$(openssl rand -base64 32)" > .env
          docker compose up -d --no-build --wait --wait-timeout 90

          curl -fsS -H 'accept: text/html' http://127.0.0.1:8080/onboarding \
            | grep '<title>Allotr</title>' > /dev/null
          curl -fsS http://127.0.0.1:8080/v1/onboarding | grep '"required":true' > /dev/null

          svstat() { docker compose exec -T allotr /command/s6-svstat "$1" "/run/service/$2"; }
          test "$(svstat -u gateway)" = true
          before=$(svstat -p server)
          docker compose exec -T allotr sh -c "kill -9 $before"
          for _ in $(seq 1 30); do
            after=$(svstat -p server)
            if [ "$after" != "$before" ] && [ "$after" != 0 ] \
              && curl -fsS http://127.0.0.1:8080/readyz > /dev/null; then
              echo "server restarted: pid $before -> $after"
              exit 0
            fi
            sleep 1
          done
          echo "::error::s6 did not restart the server"
          exit 1

      - name: Show container logs
        if: always()
        working-directory: deploy
        env:
          ALLOTR_IMAGE: allotr:ci
        run: docker compose logs --no-color || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # Scans the whole history, not only the PR's commits, so a secret
      # cannot slip in through a rebase or a branch that skipped CI.
      - name: Scan git history
        run: gitleaks git --redact --no-banner --verbose .
