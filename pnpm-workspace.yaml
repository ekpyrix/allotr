packages:
  - packages/*
  - apps/*

# better-sqlite3 13 ships prebuilt binaries in the package; building it
# from source needs a toolchain the runtime image does not have.
allowBuilds:
  better-sqlite3: false

# kysely-codegen's peer range stops below better-sqlite3 13, but codegen
# works with it (checked with `db:verify`).
peerDependencyRules:
  allowedVersions:
    kysely-codegen>better-sqlite3: '13'

catalog:
  fast-check: 4.10.2
  zod: 4.6.5
  '@types/node': 24.19.0
  typescript: 6.0.3
  vitest: 5.0.2

minimumReleaseAgeExclude:
  - '@internationalized/number@3.6.9'
  - '@react-types/shared@3.37.0'
  - react-aria-components@1.22.0
  - react-aria@3.53.0
  - react-stately@3.51.0
